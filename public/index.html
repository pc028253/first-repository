<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Repository API 測試界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .response {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .response pre {
            margin: 0;
            color: #333;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .success {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }

        .users-list {
            margin-top: 15px;
        }

        .user-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            flex: 1;
        }

        .user-info strong {
            color: #667eea;
        }

        .delete-btn {
            width: auto;
            padding: 8px 16px;
            background: #dc3545;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .links {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .links h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .links a {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .links a:hover {
            background: #764ba2;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status.online {
            background: #28a745;
            color: white;
        }

        .status.offline {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>First Repository API 測試界面 <span id="status" class="status">檢查中...</span></h1>
            <p class="subtitle">MCP 架構示例項目 - 用戶管理 API</p>
        </div>

        <div class="grid">
            <!-- 創建用戶 -->
            <div class="card">
                <h2>創建用戶</h2>
                <form id="createUserForm">
                    <div class="form-group">
                        <label for="username">用戶名稱</label>
                        <input type="text" id="username" required placeholder="請輸入用戶名稱">
                    </div>
                    <div class="form-group">
                        <label for="email">電子郵件</label>
                        <input type="email" id="email" required placeholder="user@example.com">
                    </div>
                    <button type="submit">創建用戶</button>
                </form>
                <div id="createResponse"></div>
            </div>

            <!-- 獲取用戶 -->
            <div class="card">
                <h2>獲取單個用戶</h2>
                <form id="getUserForm">
                    <div class="form-group">
                        <label for="userId">用戶 ID</label>
                        <input type="number" id="userId" required placeholder="輸入用戶 ID">
                    </div>
                    <button type="submit">獲取用戶</button>
                </form>
                <div id="getUserResponse"></div>
            </div>

            <!-- 獲取所有用戶 -->
            <div class="card">
                <h2>所有用戶列表</h2>
                <button onclick="getAllUsers()">刷新列表</button>
                <div id="usersList" class="users-list"></div>
            </div>
        </div>

        <div class="links">
            <h3>相關連結</h3>
            <a href="/api-docs" target="_blank">📚 Swagger API 文檔</a>
            <a href="/api/test/health" target="_blank">🏥 健康檢查</a>
            <a href="https://github.com/pc028253/first-repository" target="_blank">💻 GitHub 倉庫</a>
        </div>
    </div>

    <script>
        const API_BASE = '/api/test';

        // 檢查 API 狀態
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const statusEl = document.getElementById('status');
                if (data.status === 'ok') {
                    statusEl.textContent = '在線';
                    statusEl.className = 'status online';
                } else {
                    statusEl.textContent = '離線';
                    statusEl.className = 'status offline';
                }
            } catch (error) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = '離線';
                statusEl.className = 'status offline';
            }
        }

        // 創建用戶
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            try {
                const response = await fetch(`${API_BASE}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });

                const data = await response.json();
                const responseDiv = document.getElementById('createResponse');

                if (response.ok) {
                    responseDiv.innerHTML = `<div class="response success"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                    document.getElementById('createUserForm').reset();
                    getAllUsers(); // 刷新列表
                } else {
                    responseDiv.innerHTML = `<div class="response error"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                }
            } catch (error) {
                document.getElementById('createResponse').innerHTML =
                    `<div class="response error"><pre>錯誤: ${error.message}</pre></div>`;
            }
        });

        // 獲取單個用戶
        document.getElementById('getUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('userId').value;

            try {
                const response = await fetch(`${API_BASE}/users/${userId}`);
                const data = await response.json();
                const responseDiv = document.getElementById('getUserResponse');

                if (response.ok) {
                    responseDiv.innerHTML = `<div class="response success"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                } else {
                    responseDiv.innerHTML = `<div class="response error"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                }
            } catch (error) {
                document.getElementById('getUserResponse').innerHTML =
                    `<div class="response error"><pre>錯誤: ${error.message}</pre></div>`;
            }
        });

        // 獲取所有用戶
        async function getAllUsers() {
            try {
                const response = await fetch(`${API_BASE}/users`);
                const data = await response.json();
                const listDiv = document.getElementById('usersList');

                if (response.ok && data.users && data.users.length > 0) {
                    listDiv.innerHTML = data.users.map(user => `
                        <div class="user-item">
                            <div class="user-info">
                                <strong>ID: ${user.id}</strong> - ${user.username}<br>
                                <small>${user.email}</small>
                            </div>
                            <button class="delete-btn" onclick="deleteUser(${user.id})">刪除</button>
                        </div>
                    `).join('');
                } else {
                    listDiv.innerHTML = '<div class="response">目前沒有用戶</div>';
                }
            } catch (error) {
                document.getElementById('usersList').innerHTML =
                    `<div class="response error"><pre>錯誤: ${error.message}</pre></div>`;
            }
        }

        // 刪除用戶
        async function deleteUser(id) {
            if (!confirm(`確定要刪除用戶 ID ${id} 嗎？`)) return;

            try {
                const response = await fetch(`${API_BASE}/users/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    getAllUsers(); // 刷新列表
                } else {
                    const data = await response.json();
                    alert(`刪除失敗: ${data.error}`);
                }
            } catch (error) {
                alert(`錯誤: ${error.message}`);
            }
        }

        // 頁面加載時執行
        checkStatus();
        getAllUsers();
        setInterval(checkStatus, 30000); // 每30秒檢查一次狀態
    </script>
</body>
</html>
